
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Getqueuemaster Email Center</title>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<style>
body{
  font-family:Arial,sans-serif;
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

input,select{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  background:#1a73e8;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:6px;
  cursor:pointer;
}

#editor{
  height:350px;
}

.ql-editor{
  min-height:300px;
}
</style>
</head>

<body>

<h2>Getqueuemaster Email Center</h2>

<form onsubmit="handleSubmit(event)">

<label>App</label>
<select id="app">
  <option value="queuemaster">Queue Master</option>
  <option value="Tempo">Tempo</option>
</select>

<label>Email Type</label>
<select id="emailType">
  <option value="invite">Invite User</option>
  <option value="welcome">Welcome Email</option>
  <option value="announcement">Announcement</option>
  <option value="general">General Message</option>
</select>

<label>To (comma separated)</label>
<input id="to">

<label>CC (comma separated)</label>
<input id="cc">

<label>BCC (comma separated)</label>
<input id="bcc">

<label>Subject</label>
<input id="subject">

<label>Message</label>
<div id="editor"></div>

<br>
<label>Admin Password</label>
<input
  type="password"
  id="adminPassword"
  placeholder="Enter password">

<br><br>
<button type="submit">
Send Email
</button>

</form>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>

const quill = new Quill('#editor',{
  theme:'snow',
  modules:{
    toolbar:[
      ['bold','italic','underline'],
      [{header:[1,2,false]}],
      [{list:'ordered'},{list:'bullet'}],
      ['link'],
      ['clean']
    ]
  }
});

async function handleSubmit(event){

  event.preventDefault();

  const payload = {
     password: document.getElementById('adminPassword').value,
    app: document.getElementById('app').value,
    type: document.getElementById('emailType').value,
    to: document.getElementById('to').value,
    cc: document.getElementById('cc').value,
    bcc: document.getElementById('bcc').value,
    subject: document.getElementById('subject').value,
    message: quill.root.innerHTML
  };

  const response = await fetch(
    "https://getqueuemaster-email.yogeshksharma.workers.dev/",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    }
  );

  if(response.ok){
    alert("Email Sent Successfully");
  }else{
    alert("Failed To Send");
  }

}

</script>

</body>
</html>
